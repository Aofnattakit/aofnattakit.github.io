<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c47ff">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>ProofQuiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ProofQuiz · Layout: แอปมือถือคอลัมน์เดียว แถบเวลาติดบน — โจทย์เป็นภาพบน "กระดาษกราฟ" ตัวเลือกเป็นปุ่มใหญ่ระดับนิ้วโป้ง; หน้าครูเป็นแดชบอร์ดกริดที่ยืดเป็นหลายคอลัมน์บนจอกว้าง */
:root{
  --bg:#f6f4ff; --paper:#ffffff; --ink:#1f1747; --muted:#6a6493; --line:#e5e1f6;
  --accent:#6c47ff; --accent-ink:#ffffff; --accent-soft:#ece7ff; --accent-dk:#4a2bd0; --ga:#6c47ff; --gb:#ff4d94; --pink:#ff4d94;
  --mark:#f0a800; --mark-soft:#fff3d1; --ok:#0b9e6a; --ok-soft:#d9f6ea; --warn:#bf6200; --warn-soft:#ffecd2; --bad:#e1334f; --bad-soft:#ffe1e6;
  --grid:rgba(108,71,255,.06); --shadow:0 12px 32px -14px rgba(60,30,160,.28);
  --f-display:"Kanit","Sarabun",system-ui,sans-serif; --f-body:"Sarabun",system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0a22; --paper:#1a1538; --ink:#f3f0ff; --muted:#a8a2d0; --line:#30295c;
  --accent:#a28bff; --accent-ink:#170f3a; --accent-soft:#2c2366; --accent-dk:#6a50e0; --ga:#7d5cff; --gb:#ff4f9a; --pink:#ff6fae;
  --mark:#ffc93c; --mark-soft:#3b2d0c; --ok:#3ee0a0; --ok-soft:#123a2c; --warn:#ffae57; --warn-soft:#3d2a10; --bad:#ff6d86; --bad-soft:#43172a;
  --grid:rgba(162,139,255,.08); --shadow:0 12px 32px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0a22; --paper:#1a1538; --ink:#f3f0ff; --muted:#a8a2d0; --line:#30295c;
  --accent:#a28bff; --accent-ink:#170f3a; --accent-soft:#2c2366; --accent-dk:#6a50e0; --ga:#7d5cff; --gb:#ff4f9a; --pink:#ff6fae;
  --mark:#ffc93c; --mark-soft:#3b2d0c; --ok:#3ee0a0; --ok-soft:#123a2c; --warn:#ffae57; --warn-soft:#3d2a10; --bad:#ff6d86; --bad-soft:#43172a;
  --grid:rgba(162,139,255,.08); --shadow:0 12px 32px -14px rgba(0,0,0,.7); color-scheme:dark}
/* สีประจำชั้น (ม.1–ม.6) ใช้ได้ทั้งกับทั้งหน้าและการ์ดแต่ละใบ */
[data-grade="1"]{--ga:#12b886;--gb:#22b8cf;--accent:#0a8f6e;--accent-dk:#076b52;--accent-soft:#d5f5ea}
[data-grade="2"]{--ga:#1fb5d6;--gb:#3b82f6;--accent:#0e7cb5;--accent-dk:#0a5d88;--accent-soft:#d6eefa}
[data-grade="3"]{--ga:#4f6bff;--gb:#a24bff;--accent:#5146f0;--accent-dk:#3a2fc4;--accent-soft:#e6e5ff}
[data-grade="4"]{--ga:#ff9500;--gb:#ff4f3d;--accent:#d0530f;--accent-dk:#9f3e08;--accent-soft:#ffe9d6}
[data-grade="5"]{--ga:#ff7a3d;--gb:#ff3d8b;--accent:#dd2f6a;--accent-dk:#a91f4e;--accent-soft:#ffe2ec}
[data-grade="6"]{--ga:#ef4444;--gb:#a855f7;--accent:#c2307a;--accent-dk:#941f5c;--accent-soft:#fbe0ef}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"])[data-grade="1"],:root:not([data-theme="light"]) [data-grade="1"]{--accent:#3fe0b0;--accent-soft:#113a30;--accent-dk:#1fa57f}
:root:not([data-theme="light"])[data-grade="2"],:root:not([data-theme="light"]) [data-grade="2"]{--accent:#5cc8f0;--accent-soft:#10304a;--accent-dk:#2a95c4}
:root:not([data-theme="light"])[data-grade="3"],:root:not([data-theme="light"]) [data-grade="3"]{--accent:#9a96ff;--accent-soft:#262566;--accent-dk:#5f5ae0}
:root:not([data-theme="light"])[data-grade="4"],:root:not([data-theme="light"]) [data-grade="4"]{--accent:#ffa45c;--accent-soft:#3d2410;--accent-dk:#d77a2c}
:root:not([data-theme="light"])[data-grade="5"],:root:not([data-theme="light"]) [data-grade="5"]{--accent:#ff7aa6;--accent-soft:#45162b;--accent-dk:#d64478}
:root:not([data-theme="light"])[data-grade="6"],:root:not([data-theme="light"]) [data-grade="6"]{--accent:#f47bbd;--accent-soft:#451a35;--accent-dk:#c4457f}
}
:root[data-theme="dark"][data-grade="1"],:root[data-theme="dark"] [data-grade="1"]{--accent:#3fe0b0;--accent-soft:#113a30;--accent-dk:#1fa57f}
:root[data-theme="dark"][data-grade="2"],:root[data-theme="dark"] [data-grade="2"]{--accent:#5cc8f0;--accent-soft:#10304a;--accent-dk:#2a95c4}
:root[data-theme="dark"][data-grade="3"],:root[data-theme="dark"] [data-grade="3"]{--accent:#9a96ff;--accent-soft:#262566;--accent-dk:#5f5ae0}
:root[data-theme="dark"][data-grade="4"],:root[data-theme="dark"] [data-grade="4"]{--accent:#ffa45c;--accent-soft:#3d2410;--accent-dk:#d77a2c}
:root[data-theme="dark"][data-grade="5"],:root[data-theme="dark"] [data-grade="5"]{--accent:#ff7aa6;--accent-soft:#45162b;--accent-dk:#d64478}
:root[data-theme="dark"][data-grade="6"],:root[data-theme="dark"] [data-grade="6"]{--accent:#f47bbd;--accent-soft:#451a35;--accent-dk:#c4457f}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.25;text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto}
.wide{max-width:1180px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font-family:var(--f-display);font-weight:500;font-size:17px;background:var(--accent);color:var(--accent-ink);min-height:50px}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{min-height:38px;padding:8px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;width:100%;box-sizing:border-box}
.field textarea{font:14px/1.5 var(--f-num);min-height:160px}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.err{color:var(--bad);font-weight:600;min-height:1.5em;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--line);color:var(--muted)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
.demo{background:var(--mark-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:14px}
.demo b{font-family:var(--f-num)}

/* ---------- login ---------- */
.hero{padding-block:36px 18px;display:grid;gap:10px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700;text-transform:uppercase}
.hero h1{font-size:clamp(26px,7vw,34px)}
.formula{font-family:var(--f-num);font-size:clamp(22px,6.5vw,30px);color:var(--accent);background:var(--paper);border-radius:var(--r);padding:16px 18px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--line)}
.formula small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink)}
.rules li::marker{color:var(--accent)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.agree input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.foot{margin-top:22px;text-align:center;font-size:14px;color:var(--muted)}
.foot a{color:var(--accent)}

/* ---------- exam ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{flex:1 1 auto;font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-family:var(--f-num);font-size:22px;font-weight:700;padding:2px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.timer.low{background:var(--warn-soft);color:var(--warn)} .timer.crit{background:var(--bad-soft);color:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{flex:1 1 0;min-width:22px;height:28px;border-radius:7px;border:0;background:var(--line);color:var(--muted);font:600 12px var(--f-num);padding:0}
.dots button.ans{background:var(--accent-soft);color:var(--accent)}
.dots button.cur{background:var(--accent);color:var(--accent-ink)}
.qcard{margin-top:16px;display:grid;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qno{font-family:var(--f-display);font-size:20px}
.lv{font-size:13px;color:var(--muted)}
.qimg{width:100%;display:block;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.opts{display:grid;gap:10px;-webkit-user-select:none;user-select:none}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:58px;font-size:19px}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);font:700 16px var(--f-num);color:var(--muted)}
.opt .v{font-family:var(--f-num);font-weight:500;min-width:0}
.opt .v.txt{font-family:var(--f-body);font-weight:600}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:15px;max-width:min(92vw,460px);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,19,.45);z-index:40;display:grid;align-items:end;justify-items:center;padding:0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;box-sizing:border-box}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1}

/* ---------- result ---------- */
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--paper);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font:700 32px var(--f-num)} .ring span{font-size:13px;color:var(--muted)}
.rank{font-family:var(--f-display);font-size:24px}
.rank .num{color:var(--mark)} .rk-of{display:block;font-family:var(--f-body)}
.board{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:38px 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--bg)}
.brow.me{background:var(--mark-soft);box-shadow:inset 0 0 0 1.5px var(--mark)}
.brow .r{font:700 16px var(--f-num);color:var(--muted)} .brow:nth-child(-n+3) .r{color:var(--mark)}
.brow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .s{font:700 16px var(--f-num)} .brow .t{font:13px var(--f-num);color:var(--muted)}
.live{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live .dot{color:var(--ok)}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;background:var(--paper)}
.rv .q{font-size:15px} .rv .a{font-family:var(--f-num);font-size:15px}
.rv .x{font-size:14px;color:var(--muted);font-family:var(--f-num);background:var(--bg);border-radius:8px;padding:8px 10px;overflow-x:auto}

/* ---------- teacher ---------- */
.thead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:24px 10px}
.thead h1{font-size:clamp(22px,4vw,28px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-block:10px 16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:700 26px var(--f-num)} .stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:10px 14px;border-radius:10px 10px 0 0;font-family:var(--f-display);font-size:16px;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px}
.filters button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.srow{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;text-align:left;width:100%}
.srow.high{box-shadow:inset 4px 0 0 var(--bad)} .srow.watch{box-shadow:inset 4px 0 0 var(--warn)} .srow.awaynow{box-shadow:inset 4px 0 0 var(--bad);background:var(--bad-soft)}
.srow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.srow .nm{font-weight:600;min-width:0} .srow .id{font:13px var(--f-num);color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px}
.srow .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bars{display:grid;gap:12px}
.bars .b{display:grid;gap:4px}
.bars .lab{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bars .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.hist{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.hist div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.hist div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font:11px var(--f-num);color:var(--muted)}
.hx{display:flex;gap:4px} .hx span{flex:1;text-align:center;font:11px var(--f-num);color:var(--muted)}
.flags{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.flags li{display:flex;gap:10px;align-items:baseline;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px}
.flags li b{font:700 13px var(--f-num);color:var(--bad);flex:none}
.tl{display:grid;gap:4px;font-size:14px;max-height:200px;overflow:auto}
.tl div{display:flex;gap:10px} .tl .num{color:var(--muted);flex:none}
.note{font-size:14px;color:var(--muted);margin:0}
.setg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.toggle{display:flex;gap:10px;align-items:center;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
/* ---------- ปุ่มโหมดสี / ส่วนเพิ่ม ---------- */
.themebtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:0;flex:none}
.themebtn.float{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bar-r{display:flex;align-items:center;gap:6px;flex:none}
.bar-r .themebtn{width:36px;height:36px;border-radius:10px}
.hero{padding-top:52px}
.rounds{display:grid;gap:10px}
.rcard{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.rcard>div{min-width:0}.rcard .rt{font-weight:600}.rcard .btn{flex:none}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:14px;color:var(--muted)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- ProofQuiz v3 ---------- */
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.01em}
.brand b{color:var(--accent);font-weight:600}
.brand .mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:700 22px var(--f-num);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand.sm{font-size:20px}.brand.sm .mark{width:30px;height:30px;font-size:17px;border-radius:9px}
.tagline{margin:0;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.center{text-align:center}
.rcard{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);margin-top:10px}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rcard .rt{font-family:var(--f-display);font-size:18px}
.rc-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.rc-act .btn{flex:1 1 auto}
.hist-list{display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--bg);border-radius:10px;padding:10px 12px}
.hrow .hl{display:grid;min-width:0}.hrow:disabled{cursor:default;opacity:.85}
.hs{font:700 22px var(--f-num);color:var(--accent)}.hs small{font-size:13px;color:var(--muted)}
.attempts{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.att-list{display:flex;gap:8px;flex-wrap:wrap}
.att{display:grid;justify-items:center;gap:2px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted);min-width:72px}
.att b{font:700 18px var(--f-num);color:var(--ink)}
.att.best{border-color:var(--mark)}.att.best b{color:var(--mark)}
.att.on{background:var(--accent-soft);border-color:var(--accent)}
.nowbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.nb{display:grid;gap:2px;border-radius:12px;padding:10px 14px;background:var(--paper);border:1px solid var(--line)}
.nb.on{background:var(--ok-soft);border-color:transparent}
.nb b{font-family:var(--f-display);font-weight:500;font-size:17px}
.selrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.selrow .rsel{flex:1 1 320px;min-width:0}
.selrow .rsel select{width:100%;text-overflow:ellipsis}
.selmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.toggle.small{font-size:14px}.toggle.small input{width:18px;height:18px}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.sched{margin-bottom:12px}
.slist{display:grid;gap:8px}
.sitem{display:grid;grid-template-columns:110px 90px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg)}
.sitem.open{background:var(--ok-soft)}.sitem.ended,.sitem.closed{opacity:.75}.sitem.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.st-time{font-weight:700}.st-room{font-weight:600}.st-set{display:grid;min-width:0}.st-act{display:flex;gap:6px}
@media (max-width:720px){.sitem{grid-template-columns:auto 1fr auto}.st-set{grid-column:1/-1}.st-act{grid-column:1/-1}.sitem>.chip{justify-self:end}}
.brows{display:grid;gap:8px}
.brow-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border-radius:10px;padding:8px}
.brow-in select,.brow-in input{font-size:15px;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);min-width:0}
.brow-in .r-room{width:88px}.brow-in .r-date{width:150px}.brow-in .r-per{flex:1 1 150px}
.tpair{display:inline-flex;align-items:center;gap:4px}.tpair input{width:100px}
.dash{color:var(--muted)}
.icon-x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:8px;margin-left:auto}
.icon-x:hover{background:var(--bad-soft);color:var(--bad)}
.wide-sheet{max-width:860px}
.book table{font-size:14px}
.book th{white-space:normal;vertical-align:bottom;min-width:84px}
.book .stick{position:sticky;left:0;background:var(--paper);z-index:1;min-width:150px;white-space:normal}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.setcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.setcard h3{font-family:var(--f-display);font-weight:500;font-size:20px}
.setcard p{margin:0}
.formula-s{font-family:var(--f-num);font-size:14px;color:var(--accent);background:var(--bg);border-radius:8px;padding:6px 10px;overflow-x:auto}
.tlist{margin:4px 0;padding:0;list-style:none;display:grid;gap:3px;font-size:15px}
.tlist b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:700 13px var(--f-num);margin-right:4px}
.field textarea.code{font:13px/1.5 var(--f-num);min-height:220px}
.field textarea.code.short{min-height:120px}
.rules.small{font-size:15px}
.okline{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-weight:600;margin:0}
.okc{color:var(--ok)}
.samples{display:grid;gap:8px;max-height:52vh;overflow:auto;padding-right:4px}
/* ---------- ProofQuiz v4: รหัสเริ่มสอบ กันเน็ตหลุด โหมดฝึก จอโปรเจกเตอร์ รายงาน ---------- */
.inline{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.inline input{width:64px;border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--paper);font-family:var(--f-num)}
.netpill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.netpill.ok{background:var(--ok-soft);color:var(--ok)}.netpill.acc{background:var(--accent-soft);color:var(--accent)}.netpill.bad{background:var(--bad-soft);color:var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.codefield input{font:700 30px var(--f-num);letter-spacing:.45em;text-align:center;padding-left:.45em}
.rcard.retake{border-color:var(--warn);background:var(--warn-soft)}
.prac-list{display:grid;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.prow:hover{border-color:var(--accent)}
.prac-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px;padding-right:52px}
.prow .hl{display:grid;min-width:0}
.ptext{font-family:var(--f-body);font-weight:500;font-size:clamp(20px,5.6vw,25px);line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .k{background:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .k{background:var(--bad);color:var(--paper)}
.opt.dim{opacity:.5}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb p,.fb div{color:var(--ink);margin:0}
.pr-n{font-size:11px;color:var(--muted);font-family:var(--f-body)}

/* จอโปรเจกเตอร์ */
body.screen-mode{padding-bottom:16px}
.scr{max-width:1600px;margin:0 auto;display:grid;gap:18px;padding-top:12px}
.scr-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.scr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.scr-head h1{font-size:clamp(30px,4.4vw,56px)}
.scr-time{display:grid;justify-items:end}
.scr-time b{font-size:clamp(36px,5vw,64px);line-height:1;color:var(--accent)}
.scr-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.codebox{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 26px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 20px}
.codebox .eyebrow,.codebox p{grid-column:1/-1}
.codebox p{margin:0}
.codebox.off{display:block;opacity:.7}
.codebox .code{font-size:clamp(84px,13vw,190px);font-weight:700;line-height:1;color:var(--ink);display:flex;letter-spacing:0}
.codebox .code i{width:.12em}
.codebox .ring{width:140px;height:140px}.codebox .ring>div{width:112px;height:112px}.codebox .ring b{font-size:42px}
.scr-stats{display:grid;gap:12px}
.scr-stats>div{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 20px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.scr-stats b{font-size:clamp(40px,5vw,66px);line-height:1;color:var(--accent)}
.scr-stats>div:first-child b{color:var(--ok)}
.scr-stats span{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:grid;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.tile .tn{font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tb{height:7px;background:var(--line);border-radius:4px;overflow:hidden}.tile .tb i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tile .ts{font-size:13px;color:var(--muted);font-family:var(--f-num)}
.tile.done{background:var(--ok-soft);border-color:transparent}.tile.done .tb i{background:var(--ok)}.tile.done .ts{color:var(--ok);font-weight:700}
.tile.idle{opacity:.55}
.scr-idle{min-height:60vh;display:grid;place-content:center;text-align:center;gap:10px}
.scr-idle h1{font-size:clamp(30px,4vw,50px)}.scr-idle p{font-size:22px;margin:0}
.podium{display:grid;gap:8px;max-width:1100px;width:100%;margin:0 auto}
.pod{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;align-items:center;gap:18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 20px;animation:rise .5s both}
.pod .pr{font:700 30px var(--f-num);color:var(--muted);text-align:center}
.pod .pn{font-family:var(--f-display);font-size:clamp(22px,2.6vw,34px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pt{color:var(--muted);font-size:18px}
.pod .ps{font-size:clamp(28px,3vw,42px);font-weight:700;color:var(--accent)}.pod .ps small{font-size:.5em;color:var(--muted)}
.pod.r1,.pod.r2,.pod.r3{background:var(--mark-soft);border-color:var(--mark)}.pod.r1 .pr,.pod.r2 .pr,.pod.r3 .pr{color:var(--mark)}
.pod.r1{padding-block:18px}.pod.r1 .pn{font-size:clamp(28px,3.4vw,46px)}
.pod:nth-child(2){animation-delay:.08s}.pod:nth-child(3){animation-delay:.16s}.pod:nth-child(n+4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.scr>*,.scr-main>*,.codebox>*{min-width:0}
@media (max-width:820px){.scr-main{grid-template-columns:1fr}.codebox{padding:18px}.codebox .code{font-size:clamp(52px,15vw,120px)}.codebox .ring{width:110px;height:110px}.codebox .ring>div{width:88px;height:88px}.codebox .ring b{font-size:30px}.pod{grid-template-columns:40px minmax(0,1fr) auto;gap:10px}.pod .pt{display:none}}

/* รายงานหลังสอบ */
.report-print{margin-top:12px;gap:18px}
.rp-head h2{font-size:24px;margin-top:8px}
.rp-head p{margin:4px 0 0}
.rp-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rp-stats>div{background:var(--bg);border-radius:12px;padding:12px 14px;display:grid}
.rp-stats b{font:700 28px var(--f-num);color:var(--accent)}.rp-stats b small{font-size:15px;color:var(--muted)}
.rp-stats span{font-size:14px;color:var(--muted)}
.rp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rp-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.rp-grid h3{font-size:17px;margin-bottom:8px}
.hist.sm{height:110px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
@media (max-width:720px){.rp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-grid,.rp-grid.three{grid-template-columns:1fr}}
@media print{
  :root{--bg:#f3f5f4;--paper:#fff;--ink:#111;--muted:#555;--line:#ccc;--accent:#0f766e;--mark:#c27d00;--mark-soft:#fdf0d4;--ok:#1d7a3e;--bad:#b42318}
  body{background:#fff;padding:0;font-size:12px}
  body *{visibility:hidden}
  .report-print,.report-print *{visibility:visible}
  .report-print{position:absolute;left:0;top:0;width:100%;border:0;padding:0;margin:0}
  .themebtn,.noprint{display:none!important}
  .rp-grid,.rp-grid.three{grid-template-columns:repeat(2,1fr)}.rp-grid.three{grid-template-columns:repeat(3,1fr)}
  .rp-stats{grid-template-columns:repeat(4,1fr)}
  section{break-inside:avoid}
  @page{size:A4;margin:14mm}
}
/* ================= ProofQuiz v5 · สดใสแบบเกม ================= */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
body{background-color:var(--bg);background-image:radial-gradient(1100px 560px at 108% -12%,color-mix(in srgb,var(--ga) 16%,transparent),transparent 62%),radial-gradient(900px 520px at -14% -6%,color-mix(in srgb,var(--gb) 13%,transparent),transparent 60%);background-attachment:fixed}
h1,h2,h3{font-weight:600}
.grad-text{background:linear-gradient(90deg,var(--ga),var(--gb));-webkit-background-clip:text;background-clip:text;color:transparent}
/* แบรนด์ */
.brand{font-weight:600}
.brand b{background:linear-gradient(90deg,var(--ga),var(--gb));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.brand .mark{background:linear-gradient(135deg,var(--ga),var(--gb));color:#fff;border-radius:12px;transform:rotate(-7deg);font-family:var(--f-display);box-shadow:0 3px 0 color-mix(in srgb,var(--gb) 60%,#000 25%)}
.brand.light{color:#fff}.brand.light b{background:none;-webkit-text-fill-color:#fff;color:#fff}
.brand.light .mark{background:#fff;color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.15)}
/* ปุ่มแบบเกม: มีความหนา กดแล้วยุบ */
.btn{border-radius:16px;font-weight:600;box-shadow:0 4px 0 var(--accent-dk);transition:transform .08s ease,box-shadow .08s ease,filter .15s;position:relative}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dk)}
.btn.big{min-height:56px;font-size:19px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--gb)))}
.btn.soft{box-shadow:0 4px 0 var(--line)}.btn.soft:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.ghost{box-shadow:inset 0 0 0 2px var(--accent)}.btn.ghost:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 0 0 2px var(--accent)}
.btn.danger{box-shadow:0 4px 0 #8f1424}
.btn.small{box-shadow:0 3px 0 var(--accent-dk);border-radius:12px}.btn.small.soft{box-shadow:0 3px 0 var(--line)}.btn.small.ghost{box-shadow:inset 0 0 0 2px var(--accent)}
.btn:disabled{box-shadow:none;transform:none}
.btn svg{flex:none}
.pulse:not(:disabled){animation:pulse2 2s ease-out infinite}
@keyframes pulse2{0%{box-shadow:0 4px 0 var(--accent-dk),0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}70%,100%{box-shadow:0 4px 0 var(--accent-dk),0 0 0 16px transparent}}
.field input,.field select,.field textarea{border-radius:14px;border-width:2px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
.chip{font-weight:700}
.panel{border-radius:24px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow)}
.panel h2{display:flex;align-items:center;gap:8px}.panel h2 svg{color:var(--accent);width:22px;height:22px}
.lift{animation:lift .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes lift{from{opacity:0;transform:translateY(16px)}}
.still .lift,.still .hhero,.still .badge .bi{animation:none!important}
.hhero~.panel{margin-top:16px}
.foot a{font-weight:600}
.themebtn{border-radius:14px;border-width:2px}
.themebtn.float{box-shadow:var(--shadow)}
.toast{border-radius:16px;font-weight:600;animation:toastin .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.95)}}
.sheet{border-radius:26px 26px 0 0}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:80}
.floaters{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters span{position:absolute;font:600 calc(30px * var(--s)) var(--f-display);color:var(--accent);opacity:.13;animation:floaty var(--t) ease-in-out var(--dl) infinite alternate;white-space:nowrap}
@keyframes floaty{to{transform:translateY(-24px) rotate(14deg)}}
.backchip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 16px 8px 10px;font:500 15px var(--f-display);margin-top:12px;box-shadow:var(--shadow)}
.backchip svg{width:18px;height:18px;color:var(--accent)}

/* หน้าแรก: เลือกชั้น */
.landing{max-width:1000px;margin:0 auto;position:relative;padding-top:58px}
.landing>.floaters{position:fixed}
.land-hero{position:relative;z-index:1;display:grid;gap:14px;justify-items:start;padding-block:12px 4px}
.land-title{font:700 clamp(36px,8.4vw,64px)/1.12 var(--f-display);letter-spacing:-.01em}
.land-sub{margin:0;color:var(--muted);font-size:17px;max-width:34em}
.land-h{position:relative;z-index:1;font-size:19px;margin:26px 0 12px;color:var(--muted);font-weight:500}
.gcards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px}
.gcard{position:relative;overflow:hidden;text-align:left;border:0;border-radius:28px;padding:20px 22px;min-height:220px;color:#fff;background:linear-gradient(140deg,var(--ga),var(--gb));box-shadow:0 8px 0 color-mix(in srgb,var(--gb) 55%,#000 30%),0 22px 40px -18px var(--gb);display:grid;gap:8px;align-content:start;transition:transform .15s ease,box-shadow .15s;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i) * 100ms + 150ms)}
.gcard:hover{transform:translateY(-4px) rotate(-.7deg)}
.gcard:active{transform:translateY(5px);box-shadow:0 3px 0 color-mix(in srgb,var(--gb) 55%,#000 30%)}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(18px)}}
.g-sym{position:absolute;right:-4px;bottom:-22px;font:700 96px var(--f-display);opacity:.17;transform:rotate(-12deg);white-space:nowrap;pointer-events:none}
.g-top{display:flex;align-items:flex-end;gap:10px;position:relative}
.g-lab{font:500 15px/1.25 var(--f-display);opacity:.92;padding-bottom:12px}
.g-num{font:700 104px/.86 var(--f-display);text-shadow:0 5px 0 rgba(0,0,0,.13)}
.g-rooms{font-size:15px;opacity:.95;position:relative}
.gstat{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;justify-self:start;position:relative}
.gstat.live{background:#fff;color:var(--accent)}.gstat.live .dot{color:var(--ok)}
.g-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;position:relative}
.g-chip{font:500 15px var(--f-display)}
.g-go{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .2s}
.gcard:hover .g-go{transform:translateX(4px)}
.landing .demo,.landing .foot{position:relative;z-index:1}

/* หัวการ์ดไล่สี (เข้าระบบ / หน้าหลัก / ผลสอบ) */
.ghero,.hhero,.rhero{position:relative;overflow:hidden;border-radius:28px;color:#fff;background:linear-gradient(140deg,var(--ga),var(--gb));box-shadow:0 20px 40px -20px var(--gb)}
.ghero .floaters span,.hhero .floaters span,.rhero .floaters span{color:#fff;opacity:.17}
.ghero{padding:20px 22px 22px;margin:14px 0 16px;animation:lift .5s both}
.ghero-in{position:relative;display:grid;gap:2px}
.ghero-g{font:700 clamp(56px,18vw,84px)/1 var(--f-display);margin-top:10px;text-shadow:0 5px 0 rgba(0,0,0,.12)}
.ghero-g span{font-size:.5em;margin-right:4px}.ghero-g b{font-weight:700}
.ghero p{margin:0;opacity:.92;font-size:16px}
.hhero{padding:18px 18px 16px;margin:58px 0 0;display:grid;gap:14px;animation:lift .5s both}
.hh-top,.hh-me,.hh-stats{position:relative}
.hh-me{display:flex;gap:14px;align-items:center}
.avatar{width:60px;height:60px;border-radius:20px;background:#fff;color:var(--accent);display:grid;place-items:center;font:700 30px var(--f-display);transform:rotate(-6deg);box-shadow:0 4px 0 rgba(0,0,0,.14);flex:none}
.hh-me h1{font-size:clamp(24px,7vw,30px)}.hh-me p{margin:0;opacity:.92;font-size:15px}
.hh-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hh-stats>div{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 12px;display:grid}
.hh-stats b{font:700 28px/1.1 var(--f-display)}.hh-stats .cnt,.ring.big .cnt{font:inherit;color:inherit;opacity:1}.hh-stats small{font-size:16px;opacity:.8}.hh-stats span{font-size:13px;opacity:.95}
/* การ์ดรอบสอบ */
.rcard{border:2px solid var(--line);border-radius:20px;padding:14px;background:var(--paper);gap:8px}
.rcard .rt{font-size:19px;font-weight:600}
.rcard.hot{border:2.5px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,var(--ga),var(--gb)) border-box;box-shadow:0 12px 28px -16px var(--gb)}
.rcard.retake{background:var(--warn-soft);border-color:var(--warn)}
.emptyb{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:18px;padding:14px 16px}
.emptyb svg{width:30px;height:30px;color:var(--accent);flex:none}.emptyb p{margin:0}
/* ฝึก */
.prow{border:0;background:var(--bg);border-radius:18px;padding:12px 12px 12px 16px;transition:transform .15s}
.prow:hover{transform:translateX(3px)}.prow .hl{flex:1}
.pbar{display:block;height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ga),var(--gb))}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--accent-dk)}
.prac-top .chip.acc{background:linear-gradient(90deg,var(--ga),var(--gb));color:#fff}
.prog i{background:linear-gradient(90deg,var(--ga),var(--gb))}
.opt{border-radius:16px;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt .k{border-radius:11px;font-family:var(--f-display)}
.opt.right{animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
/* ป้ายรางวัล */
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge{display:grid;justify-items:center;align-content:start;text-align:center;gap:5px;padding:12px 4px 10px;border-radius:18px;background:var(--bg)}
.badge .bi{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);opacity:.75}
.badge .bi svg{width:25px;height:25px}
.badge b{font:600 14px/1.2 var(--f-display);color:var(--muted)}.badge small{font-size:11.5px;line-height:1.3;color:var(--muted)}
.badge.on .bi{opacity:1;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.badge.on b{color:var(--ink)}.badge.on small{color:var(--ok);font-weight:700}
.b-first.on .bi{background:linear-gradient(135deg,#22c55e,#06b6d4)}.b-grind.on .bi{background:linear-gradient(135deg,#ffb400,#ff4f3d)}
.b-up.on .bi{background:linear-gradient(135deg,#3b82f6,#8b5cf6)}.b-full.on .bi{background:linear-gradient(135deg,#ffd23f,#ff8a00)}
.badge.new .bi{animation:wiggle .9s ease 3}
@keyframes wiggle{25%{transform:rotate(-14deg) scale(1.12)}75%{transform:rotate(14deg) scale(1.12)}}
@media (max-width:370px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hrow{border-radius:16px}
.hs.pass{color:var(--ok)}.hs.full{color:var(--mark)}.hs.low{color:var(--bad)}
.up{color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:2px}.up svg{width:14px;height:14px}
/* ผลสอบ */
.rhero{padding:22px 20px 24px;margin-bottom:16px;display:grid;justify-items:center;text-align:center;gap:8px}
.rhero>*{position:relative}.rhero>.floaters{position:absolute}
.rhero .eyebrow{color:inherit;opacity:.92;text-transform:none;letter-spacing:.02em}
.rhero h1{font:700 clamp(30px,9vw,40px)/1.15 var(--f-display)}.rhero p{margin:0;opacity:.94}
.rhero.try{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.rhero.try .floaters span{color:var(--accent);opacity:.1}.rhero.try .eyebrow{color:var(--accent)}
.ring.big{width:172px;height:172px;margin:6px 0;background:conic-gradient(#fff calc(var(--p) * 1%),rgba(255,255,255,.28) 0);transition:--p 1.3s cubic-bezier(.2,.8,.2,1)}
.ring.big>div{width:138px;height:138px;background:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.ring.big b{font:700 58px/1 var(--f-display);color:var(--accent)}.ring.big b small{font-size:24px;color:var(--muted)}
.rhero.try .ring.big{background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--line) 0)}.rhero.try .ring.big>div{background:var(--bg)}
.upchip{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ok);border-radius:999px;padding:6px 14px;font-weight:700;animation:pop .5s .7s cubic-bezier(.2,.9,.3,1.4) both}
.rhero.try .upchip{background:var(--ok-soft)}.upchip svg{width:18px;height:18px}
.rhero .btn{margin-top:8px}
.score.solo{grid-template-columns:1fr}
.brow{border-radius:14px}
.brow:nth-child(1){background:linear-gradient(90deg,color-mix(in srgb,var(--mark) 22%,var(--bg)),var(--bg))}
/* ครู: QR */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.qrcard{display:grid;gap:8px;justify-items:center;text-align:center;background:var(--bg);border-radius:20px;padding:14px;border-top:6px solid var(--accent)}
.qrcard b{font:600 22px var(--f-display);color:var(--accent)}
.qr{width:184px;height:184px;border-radius:12px;display:block}
.qrlink{word-break:break-all;font-size:12px}
.qrfull{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:linear-gradient(140deg,var(--ga),var(--gb));padding:20px;cursor:pointer}
.qrf-in{background:var(--paper);border-radius:30px;padding:24px 28px;display:grid;gap:10px;justify-items:center;text-align:center;max-width:94vw;box-sizing:border-box}
.qrf-in h1{font:700 clamp(36px,6vw,56px)/1.1 var(--f-display);color:var(--accent)}.qrf-in p{margin:0;font-size:20px}
.qrf-in .qr{width:min(62vh,78vw);height:min(62vh,78vw)}
.qrf-in .note{word-break:break-all}
.stat{border-radius:16px}.tabs button.on{font-weight:600}
/* ================= หน้ารวมแบบแดชบอร์ด ================= */
.hub{max-width:1260px;margin:0 auto}
html{overflow-x:clip}
.topnav{position:sticky;top:0;z-index:30;margin:0 calc(50% - 50vw);background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
.tn-in{max-width:1260px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.tn-links{display:flex;gap:4px;margin-left:12px}
.tn-links a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font:500 15px var(--f-display)}
.tn-links a svg{width:18px;height:18px}
.tn-links a:hover{color:var(--ink);background:var(--bg)}
.tn-links a.on{color:var(--accent);background:var(--accent-soft)}
.tn-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.gchip{display:inline-flex;align-items:center;gap:2px;border:0;border-radius:999px;padding:6px 8px 6px 14px;font:600 15px var(--f-display);color:#fff;background:linear-gradient(135deg,var(--ga),var(--gb));box-shadow:0 3px 0 color-mix(in srgb,var(--gb) 55%,#000 25%)}
.gchip svg{width:18px;height:18px}
.avatar.xs{width:40px;height:40px;border-radius:13px;font-size:19px;border:0;background:linear-gradient(135deg,var(--ga),var(--gb));color:#fff;transform:none;box-shadow:0 3px 0 color-mix(in srgb,var(--gb) 55%,#000 25%)}
.avatar.sm{width:48px;height:48px;border-radius:16px;font-size:23px;background:linear-gradient(135deg,var(--ga),var(--gb));color:#fff;transform:rotate(-5deg)}
.topnav .themebtn{position:static;width:40px;height:40px}
.hub-in{padding-top:18px}
/* แบนเนอร์ */
.banner{position:relative;overflow:hidden;border-radius:26px;padding:28px 30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;gap:10px;color:#fff;
  background:radial-gradient(500px 260px at 85% 0%,color-mix(in srgb,var(--gb) 45%,transparent),transparent 70%),radial-gradient(420px 260px at 0% 100%,color-mix(in srgb,var(--ga) 50%,transparent),transparent 70%),linear-gradient(135deg,#170f3d,#2a1a66 55%,#1c1450);box-shadow:0 22px 44px -22px #2a1a66;animation:lift .5s both}
.banner::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000 60%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);pointer-events:none}
.bn-txt{position:relative;z-index:1;display:grid;gap:10px;justify-items:start}
.bn-eye{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--f-display);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 12px}
.bn-eye .dot{color:#4ade80}
.banner h1{font:700 clamp(26px,4.2vw,42px)/1.15 var(--f-display)}
.hl2{color:#ffc93c}
.banner p{margin:0;color:rgba(255,255,255,.82);font-size:16px;max-width:34em}
.bn-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn.hb-main{background:linear-gradient(135deg,#ffb020,#ff7a00);color:#2a1300;box-shadow:0 4px 0 #b85200}
.btn.hb-main:active:not(:disabled){box-shadow:0 1px 0 #b85200}
.btn.hb-alt{background:rgba(124,92,255,.85);color:#fff;box-shadow:0 4px 0 #3c22a8}
.btn.hb-alt:active:not(:disabled){box-shadow:0 1px 0 #3c22a8}
.bn-act .btn{min-height:48px;padding-inline:20px;gap:8px}
.illu{position:relative;z-index:1;width:100%;max-width:360px;justify-self:end;height:auto}
.illu .spark{animation:twinkle 2.4s ease-in-out infinite;transform-origin:center}
@keyframes twinkle{50%{opacity:.35}}
/* สถิติ */
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.hst{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px 18px;--c:#3b82f6;background:color-mix(in srgb,var(--c) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--c) 22%,transparent);animation:lift .5s both}
.hst.s2{--c:#10b981;animation-delay:60ms}.hst.s3{--c:#8b5cf6;animation-delay:120ms}
.hst-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--paper));color:var(--c);flex:none}
.hst-ic svg{width:26px;height:26px}
.hst b{display:block;font:700 clamp(22px,3vw,30px)/1.1 var(--f-display);color:var(--c)}
.hst span{font-size:13px;color:var(--muted);letter-spacing:.02em}
/* เนื้อหา + แถบข้าง */
.hub-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:22px;align-items:start}
.hub-side{display:grid;gap:16px;position:sticky;top:78px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;scroll-margin-top:80px}
.fchips button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 16px;font:500 15px var(--f-display)}
.fchips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-dk)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.qcard{position:relative;display:flex;flex-direction:column;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px 16px 14px;box-shadow:0 8px 22px -16px rgba(40,20,120,.35);overflow:hidden;animation:lift .45s both;animation-delay:calc(var(--i) * 45ms);transition:transform .15s,box-shadow .15s}
.qcard[hidden]{display:none}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--ga),var(--gb))}
.qcard.is-prac::before{background:linear-gradient(90deg,#10b981,#22d3ee)}
.qcard:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(40,20,120,.45)}
.qcard.is-live{border:2px solid #f5b100;background:linear-gradient(180deg,color-mix(in srgb,#ffc93c 13%,var(--paper)),var(--paper) 55%);box-shadow:0 14px 30px -16px rgba(245,177,0,.6)}
.qcard.is-live::before{background:linear-gradient(90deg,#ffc93c,#ff8a00)}
.qcard.is-retake{border:2px solid var(--warn)}
.qcard.is-closed{opacity:.86}
.qc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 12.5px var(--f-display);border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-exam{background:var(--accent-soft);color:var(--accent)}.p-prac{background:var(--ok-soft);color:var(--ok)}
.p-live{background:linear-gradient(90deg,#ffc93c,#ff9a1f);color:#3a2000}.p-live .dot{color:#0b9e6a}
.p-retake{background:var(--warn-soft);color:var(--warn)}.p-done{background:var(--bg);color:var(--muted)}
.qc-when{font-size:12.5px;color:var(--muted);text-align:right}
.qc-tag{align-self:flex-start;font:600 11.5px var(--f-display);letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px}
.qcard.is-prac .qc-tag{color:var(--ok);background:var(--ok-soft)}
.qcard h3{font:600 18px/1.35 var(--f-display);margin:0}
.qc-stats{display:flex;flex-wrap:wrap;gap:6px}
.qc-stats span{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:3px 8px}
.qc-stats svg{width:15px;height:15px;color:var(--accent)}
.mybest{font-size:13.5px;color:var(--ok);font-weight:600}.mybest.dim{color:var(--muted);font-weight:400}
.qc-act{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.qc-act .btn{flex:1;gap:6px}.qc-act .btn svg{width:17px;height:17px}
.btn.gold{background:linear-gradient(135deg,#ffb020,#ff8a00);color:#2a1300;box-shadow:0 3px 0 #b85200}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 #b85200}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}.iconbtn svg{width:18px;height:18px}
/* แถบข้าง */
.side-card{background:var(--paper);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:22px;padding:16px;box-shadow:var(--shadow);scroll-margin-top:80px;animation:lift .5s both;animation-delay:.12s}
.sc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.side-card h3{display:flex;align-items:center;gap:8px;font:600 18px var(--f-display);margin:0}
.side-card h3 svg{color:var(--mark)}
.side-card h4{font:600 15px var(--f-display);margin:14px 0 6px;color:var(--muted)}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:24px 36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:14px}

.lb-n{font:700 17px var(--f-display);color:var(--muted);text-align:center}
.lb li.r1 .lb-n{color:#e0a000}
.lb-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 16px var(--f-display);color:#fff;background:linear-gradient(135deg,var(--ga),var(--gb))}
.lb li:nth-child(2) .lb-av{background:linear-gradient(135deg,#22c55e,#06b6d4)}.lb li:nth-child(3) .lb-av{background:linear-gradient(135deg,#f59e0b,#ef4444)}.lb li:nth-child(4) .lb-av{background:linear-gradient(135deg,#3b82f6,#8b5cf6)}.lb li:nth-child(5) .lb-av{background:linear-gradient(135deg,#ec4899,#f97316)}
.lb-name{font-weight:600;display:grid;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb-name small{font-weight:400;font-size:12px;color:var(--muted)}
.lb-s{font:600 14px var(--f-display);color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:3px 10px}
.me-top{display:flex;align-items:center;gap:12px}

          (D.top.length ? '' : '<p class="note">ยังไม่มีคนส่ง</p>');
      } else {
        var t = D.tiles || [], done = t.filter(function (x) { return x.status === 'done'; }).length, doing = t.filter(function (x) { return x.status === 'doing'; }).length;
        S.innerHTML = top + '<div class="scr-head"><div><span class="eyebrow">' + h(D.grade) + ' · ม.' + h(r.rooms.join(', ม.')) + (r.retakeOf ? ' · สอบซ่อม' : '') + '</span><h1>' + h(D.chapter) + '</h1></div>' +
          (r.status === 'scheduled' ? '<div class="scr-time"><span class="eyebrow">ปิดรอบใน</span><b class="num" id="cl">' + mmss(r.closeAt - now) + '</b></div>' : '') + '</div>' +
          '<div class="scr-main">' + (D.code ? '<div class="codebox"><span class="eyebrow">รหัสเริ่มสอบ</span><div class="code num">' + D.code.split('').join('<i></i>') + '</div><div class="ring" id="ring" style="--p:100"><div><b class="num" id="cd"></b><span>วินาที</span></div></div><p class="note">กรอกรหัสนี้ในหน้ากติกาก่อนเริ่มสอบ · รหัสเปลี่ยนทุก 30 วินาที</p></div>' : '<div class="codebox off"><span class="eyebrow">รอบนี้ไม่ใช้รหัสเริ่มสอบ</span></div>') +
          '<div class="scr-stats"><div><b class="num">' + done + '</b><span>ส่งแล้ว</span></div><div><b class="num">' + doing + '</b><span>กำลังทำ</span></div><div><b class="num">' + (t.length - done - doing) + '</b><span>ยังไม่เริ่ม</span></div></div></div>' +
          '<div class="tiles">' + t.map(function (x) { var pct = Math.round(x.answered / D.count * 100); return '<div class="tile ' + x.status + '"><span class="tn">' + h(x.name.split(' ')[0]) + '</span><span class="tb"><i style="width:' + (x.status === 'done' ? 100 : pct) + '%"></i></span><span class="ts">' + (x.status === 'done' ? '✓ ส่งแล้ว' : x.status === 'doing' ? x.answered + '/' + D.count : 'ยังไม่เริ่ม') + '</span></div>'; }).join('') + '</div>';
      }
      $('back').onclick = function () { location.hash = '#teacher'; };
      var rv = $('rev'), hd = $('hide');
      if (rv) rv.onclick = function () { inlineConfirm(rv, 'กดอีกครั้งเพื่อประกาศผลบนจอ', function () { call('saveRounds', { pass: ss('pq-tp'), rounds: [{ examId: r.examId, revealed: true }] }).then(function () { get(ss('pq-tp')); }); }); };
      if (hd) hd.onclick = function () { call('saveRounds', { pass: ss('pq-tp'), rounds: [{ examId: r.examId, revealed: false }] }).then(function () { get(ss('pq-tp')); }); };
      Theme.apply(); countdown();
    }
    return { mount: mount };
  })();

  Theme.apply();
  route();
})();

</script>

</body>
</html>
